<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="devBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A1C" />
      <stop offset="100%" stop-color="#020C0D" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="16" fill="url(#devBg3)" stroke="#134E4A" stroke-width="2"/>
  
  <!-- Database Architecture & AI Pipeline Window -->
  <rect x="30" y="40" width="340" height="230" rx="10" fill="#0F2E2E" stroke="#134E4A" stroke-width="1.5"/>
  <rect x="30" y="40" width="340" height="30" rx="10" fill="#071E1F"/>
  <circle cx="50" cy="55" r="4.5" fill="#EF4444"/>
  <circle cx="65" cy="55" r="4.5" fill="#F59E0B"/>
  <circle cx="80" cy="55" r="4.5" fill="#10B981"/>
  <text x="100" y="59" fill="#5EEAD4" font-family="sans-serif" font-size="11">Supabase &amp; PostgreSQL Pipeline</text>

  <!-- Database Cylinders -->
  <g transform="translate(50, 85)">
    <rect width="130" height="120" rx="8" fill="#133E3E" stroke="#2DD4BF" stroke-width="1"/>
    <text x="14" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">🗄️ PostgreSQL</text>
    <text x="14" y="50" fill="#99F6E4" font-family="monospace" font-size="10">SELECT * FROM</text>
    <text x="14" y="68" fill="#F59E0B" font-family="monospace" font-size="10">users_automation</text>
    <rect x="14" y="85" width="100" height="18" rx="4" fill="#2DD4BF" opacity="0.2"/>
    <text x="22" y="98" fill="#2DD4BF" font-family="sans-serif" font-size="9" font-weight="bold">Index: 0.12ms</text>
  </g>

  <!-- Neural AI Agent Node -->
  <g transform="translate(210, 85)">
    <rect width="140" height="120" rx="8" fill="#133E3E" stroke="#10B981" stroke-width="1"/>
    <text x="14" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">🤖 AI Assisted Pipeline</text>
    <circle cx="35" cy="65" r="12" fill="url(#tealGrad)"/>
    <circle cx="75" cy="65" r="12" fill="url(#greenG)"/>
    <circle cx="115" cy="65" r="12" fill="url(#tealGrad)"/>
    <line x1="47" y1="65" x2="63" y2="65" stroke="#5EEAD4" stroke-width="2"/>
    <line x1="87" y1="65" x2="103" y2="65" stroke="#5EEAD4" stroke-width="2"/>
    <text x="14" y="105" fill="#A7F3D0" font-family="sans-serif" font-size="10" font-weight="bold">Automation 10x Faster</text>
  </g>

  <!-- Bottom Floating Badges -->
  <g transform="translate(30, 290)">
    <rect width="105" height="42" rx="8" fill="#0F2E2E" stroke="#2DD4BF" stroke-width="1"/>
    <text x="14" y="26" fill="#2DD4BF" font-family="sans-serif" font-size="13" font-weight="bold">⚡ Supabase</text>
  </g>

  <g transform="translate(148, 290)">
    <rect width="115" height="42" rx="8" fill="#0F2E2E" stroke="#10B981" stroke-width="1"/>
    <text x="14" y="26" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="bold">🗄️ PostgreSQL</text>
  </g>

  <g transform="translate(275, 290)">
    <rect width="95" height="42" rx="8" fill="#0F2E2E" stroke="#F59E0B" stroke-width="1"/>
    <text x="14" y="26" fill="#FBBF24" font-family="sans-serif" font-size="13" font-weight="bold">🧠 AI Coding</text>
  </g>

  <text x="200" y="365" fill="#5EEAD4" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="500">
    Workflow Automation • Realtime DB • Custom Integrations
  </text>
</svg>
