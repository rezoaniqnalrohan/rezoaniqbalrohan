<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="satBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#satBg)" stroke="#1F2937" stroke-width="2"/>

  <!-- Decorative Glow Circles -->
  <circle cx="700" cy="80" r="140" fill="#F59E0B" opacity="0.08" filter="url(#glow)"/>
  <circle cx="120" cy="460" r="120" fill="#8B5CF6" opacity="0.08" filter="url(#glow)"/>

  <!-- Browser Header Bar -->
  <rect x="20" y="20" width="760" height="44" rx="10" fill="#161F30" stroke="#25334D" stroke-width="1"/>
  <circle cx="45" cy="42" r="5" fill="#EF4444" />
  <circle cx="62" cy="42" r="5" fill="#F59E0B" />
  <circle cx="79" cy="42" r="5" fill="#10B981" />
  
  <rect x="110" y="30" width="460" height="24" rx="6" fill="#0B0F19" stroke="#1F2937" stroke-width="1"/>
  <text x="130" y="46" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">https://satoprose.com/admin/dashboard • Saudi Arabia (SAU)</text>
  
  <rect x="680" y="32" width="80" height="20" rx="10" fill="#F59E0B" opacity="0.2"/>
  <text x="696" y="46" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold">● LIVE</text>

  <!-- Dashboard Metrics Row -->
  <!-- Card 1: Revenue -->
  <g transform="translate(40, 85)">
    <rect width="220" height="90" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
    <text x="16" y="28" fill="#9CA3AF" font-family="sans-serif" font-size="12">Total Revenue (SAR)</text>
    <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">SAR 384,920</text>
    <rect x="16" y="66" width="64" height="16" rx="4" fill="#10B981" opacity="0.2"/>
    <text x="22" y="78" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">↑ +32.4%</text>
  </g>

  <!-- Card 2: Orders -->
  <g transform="translate(290, 85)">
    <rect width="220" height="90" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
    <text x="16" y="28" fill="#9CA3AF" font-family="sans-serif" font-size="12">Monthly Orders</text>
    <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">2,845</text>
    <rect x="16" y="66" width="70" height="16" rx="4" fill="#6366F1" opacity="0.2"/>
    <text x="22" y="78" fill="#818CF8" font-family="sans-serif" font-size="10" font-weight="bold">99.2% Fulfilled</text>
  </g>

  <!-- Card 3: Conversion -->
  <g transform="translate(540, 85)">
    <rect width="220" height="90" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
    <text x="16" y="28" fill="#9CA3AF" font-family="sans-serif" font-size="12">Store Conversion</text>
    <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">4.92%</text>
    <rect x="16" y="66" width="60" height="16" rx="4" fill="#F59E0B" opacity="0.2"/>
    <text x="22" y="78" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="bold">Top Tier</text>
  </g>

  <!-- Main Showcase Section: E-Commerce Storefront Cards -->
  <g transform="translate(40, 200)">
    <rect width="470" height="320" rx="14" fill="#131B2A" stroke="#25334D" stroke-width="1"/>
    <text x="20" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">Satoprose Luxury Catalog</text>
    <text x="20" y="50" fill="#9CA3AF" font-family="sans-serif" font-size="11">Laravel Backend &amp; React Storefront Integration</text>

    <!-- Product Item 1 -->
    <g transform="translate(20, 70)">
      <rect width="205" height="230" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="181" height="110" rx="8" fill="#0F172A"/>
      <!-- Icon Graphic -->
      <circle cx="102" cy="67" r="32" fill="url(#goldGrad)" opacity="0.8"/>
      <text x="102" y="73" fill="#FFFFFF" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold">🛍️</text>
      <text x="14" y="145" fill="#F3F4F6" font-family="sans-serif" font-size="13" font-weight="bold">Royal Oud Luxury Elixir</text>
      <text x="14" y="165" fill="#9CA3AF" font-family="sans-serif" font-size="11">Premium Fragrance (50ml)</text>
      <text x="14" y="200" fill="#F59E0B" font-family="sans-serif" font-size="15" font-weight="bold">SAR 650</text>
      <rect x="130" y="182" width="62" height="26" rx="6" fill="#F59E0B"/>
      <text x="142" y="199" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">Buy Now</text>
    </g>

    <!-- Product Item 2 -->
    <g transform="translate(245, 70)">
      <rect width="205" height="230" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="181" height="110" rx="8" fill="#0F172A"/>
      <!-- Icon Graphic -->
      <circle cx="102" cy="67" r="32" fill="url(#accentGrad)" opacity="0.8"/>
      <text x="102" y="73" fill="#FFFFFF" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold">⌚</text>
      <text x="14" y="145" fill="#F3F4F6" font-family="sans-serif" font-size="13" font-weight="bold">Chronograph Platinum</text>
      <text x="14" y="165" fill="#9CA3AF" font-family="sans-serif" font-size="11">Automated Stock Tracking</text>
      <text x="14" y="200" fill="#F59E0B" font-family="sans-serif" font-size="15" font-weight="bold">SAR 1,890</text>
      <rect x="130" y="182" width="62" height="26" rx="6" fill="#F59E0B"/>
      <text x="142" y="199" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold">Buy Now</text>
    </g>
  </g>

  <!-- Right Analytics Panel -->
  <g transform="translate(530, 200)">
    <rect width="230" height="320" rx="14" fill="#131B2A" stroke="#25334D" stroke-width="1"/>
    <text x="16" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Sales Performance</text>
    
    <!-- Chart Background Grid -->
    <line x1="16" y1="120" x2="214" y2="120" stroke="#1F2937" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="16" y1="170" x2="214" y2="170" stroke="#1F2937" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="16" y1="220" x2="214" y2="220" stroke="#1F2937" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Chart Path -->
    <path d="M 20 220 Q 50 180 80 190 T 140 110 T 210 70" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="210" cy="70" r="5" fill="#F59E0B" />
    <circle cx="140" cy="110" r="4" fill="#F59E0B" />

    <!-- Tech Stack Pill Tags -->
    <text x="16" y="260" fill="#9CA3AF" font-family="sans-serif" font-size="11">Tech Stack:</text>
    <rect x="16" y="275" width="80" height="22" rx="6" fill="#3B82F6" opacity="0.2"/>
    <text x="24" y="290" fill="#60A5FA" font-family="sans-serif" font-size="10" font-weight="bold">PHP / Laravel</text>

    <rect x="105" y="275" width="60" height="22" rx="6" fill="#10B981" opacity="0.2"/>
    <text x="114" y="290" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold">MySQL</text>

    <rect x="172" y="275" width="46" height="22" rx="6" fill="#F59E0B" opacity="0.2"/>
    <text x="179" y="290" fill="#FBBF24" font-family="sans-serif" font-size="10" font-weight="bold">GTM4</text>
  </g>
</svg>
