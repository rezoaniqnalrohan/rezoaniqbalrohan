<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="petBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#petBg)" stroke="#334155" stroke-width="2"/>

  <!-- Glow Elements -->
  <circle cx="680" cy="120" r="140" fill="#EA580C" opacity="0.08" filter="url(#glow3)"/>
  <circle cx="140" cy="460" r="120" fill="#10B981" opacity="0.08" filter="url(#glow3)"/>

  <!-- Browser Header Bar -->
  <rect x="20" y="20" width="760" height="44" rx="10" fill="#182234" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="42" r="5" fill="#EF4444" />
  <circle cx="62" cy="42" r="5" fill="#F59E0B" />
  <circle cx="79" cy="42" r="5" fill="#10B981" />
  
  <rect x="110" y="30" width="480" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="130" y="46" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">https://kenpetshop.us • United States (USA)</text>
  
  <rect x="680" y="32" width="80" height="20" rx="10" fill="#EA580C" opacity="0.2"/>
  <text x="696" y="46" fill="#FB923C" font-family="sans-serif" font-size="10" font-weight="bold">● STORE</text>

  <!-- Top Metrics Row -->
  <g transform="translate(40, 85)">
    <rect width="220" height="85" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12">Pet Parents Served</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">42,500+</text>
    <text x="16" y="74" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">↑ +45% Growth (USA)</text>
  </g>

  <g transform="translate(290, 85)">
    <rect width="220" height="85" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12">Monthly Subscriptions</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">3,890 Active</text>
    <text x="16" y="74" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">Auto-Reorder System</text>
  </g>

  <g transform="translate(540, 85)">
    <rect width="220" height="85" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12">Customer Satisfaction</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">99.4%</text>
    <text x="16" y="74" fill="#FB923C" font-family="sans-serif" font-size="10" font-weight="bold">Verified 5.0 Rating</text>
  </g>

  <!-- Main Storefront Showcase Cards -->
  <g transform="translate(40, 195)">
    <rect width="470" height="325" rx="14" fill="#141E2E" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">Ken Pet Shop USA E-Commerce</text>
    <text x="20" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11">WordPress, WooCommerce &amp; Automated Stock API</text>

    <!-- Product 1 -->
    <g transform="translate(20, 68)">
      <rect width="205" height="235" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="181" height="115" rx="8" fill="#0F172A"/>
      <circle cx="102" cy="70" r="30" fill="url(#orangeGrad)" opacity="0.8"/>
      <text x="102" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="24" text-anchor="middle">🐶</text>
      <text x="14" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Organic Canine Nutrition</text>
      <text x="14" y="170" fill="#94A3B8" font-family="sans-serif" font-size="11">High-Protein Formula</text>
      <text x="14" y="205" fill="#FB923C" font-family="sans-serif" font-size="16" font-weight="bold">$44.99</text>
      <rect x="130" y="188" width="62" height="26" rx="6" fill="#EA580C"/>
      <text x="142" y="205" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Order</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(245, 68)">
      <rect width="205" height="235" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="181" height="115" rx="8" fill="#0F172A"/>
      <circle cx="102" cy="70" r="30" fill="url(#greenGrad)" opacity="0.8"/>
      <text x="102" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="24" text-anchor="middle">🐱</text>
      <text x="14" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Smart Interactive Laser</text>
      <text x="14" y="170" fill="#94A3B8" font-family="sans-serif" font-size="11">Automated Play Companion</text>
      <text x="14" y="205" fill="#FB923C" font-family="sans-serif" font-size="16" font-weight="bold">$29.99</text>
      <rect x="130" y="188" width="62" height="26" rx="6" fill="#EA580C"/>
      <text x="142" y="205" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Order</text>
    </g>
  </g>

  <!-- Right Inventory & Meta Ads Panel -->
  <g transform="translate(530, 195)">
    <rect width="230" height="325" rx="14" fill="#141E2E" stroke="#334155" stroke-width="1"/>
    <text x="16" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Marketing &amp; Stock</text>
    
    <g transform="translate(15, 50)">
      <rect width="200" height="60" rx="8" fill="#1E293B"/>
      <text x="12" y="24" fill="#94A3B8" font-family="sans-serif" font-size="11">Meta Ad ROAS:</text>
      <text x="12" y="46" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="bold">5.8x Return on Ad Spend</text>
    </g>

    <g transform="translate(15, 120)">
      <rect width="200" height="60" rx="8" fill="#1E293B"/>
      <text x="12" y="24" fill="#94A3B8" font-family="sans-serif" font-size="11">Inventory Automated Sync:</text>
      <text x="12" y="46" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="bold">● 1,400 SKUs Synced</text>
    </g>

    <!-- Tech Stack Pill Tags -->
    <text x="16" y="225" fill="#94A3B8" font-family="sans-serif" font-size="11">Technologies:</text>
    <rect x="16" y="240" width="95" height="22" rx="6" fill="#EA580C" opacity="0.2"/>
    <text x="22" y="255" fill="#FB923C" font-family="sans-serif" font-size="10" font-weight="bold">WordPress / Woo</text>

    <rect x="120" y="240" width="85" height="22" rx="6" fill="#3B82F6" opacity="0.2"/>
    <text x="126" y="255" fill="#60A5FA" font-family="sans-serif" font-size="10" font-weight="bold">Meta Ads Mgr</text>

    <rect x="16" y="270" width="85" height="22" rx="6" fill="#10B981" opacity="0.2"/>
    <text x="24" y="285" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold">GTM4 Tracking</text>
  </g>
</svg>
