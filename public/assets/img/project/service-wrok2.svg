<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="hjsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A" />
      <stop offset="50%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132238" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B1728" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#hjsBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Decorative Glow -->
  <circle cx="720" cy="100" r="130" fill="#06B6D4" opacity="0.08" filter="url(#glow2)"/>
  <circle cx="100" cy="480" r="110" fill="#3B82F6" opacity="0.08" filter="url(#glow2)"/>

  <!-- Window Header Bar -->
  <rect x="20" y="20" width="760" height="44" rx="10" fill="#0E1E36" stroke="#1E3A5F" stroke-width="1"/>
  <circle cx="45" cy="42" r="5" fill="#EF4444" />
  <circle cx="62" cy="42" r="5" fill="#F59E0B" />
  <circle cx="79" cy="42" r="5" fill="#10B981" />
  
  <rect x="110" y="30" width="480" height="24" rx="6" fill="#040D1A" stroke="#1E293B" stroke-width="1"/>
  <text x="130" y="46" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">https://hjsuperservice.com.au/dispatch • Australia (AUS)</text>
  
  <rect x="680" y="32" width="80" height="20" rx="10" fill="#06B6D4" opacity="0.2"/>
  <text x="696" y="46" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">● ACTIVE</text>

  <!-- Top Metrics Row -->
  <g transform="translate(40, 85)">
    <rect width="220" height="85" rx="12" fill="url(#cardGrad2)" stroke="#1E3A5F" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12">Fleet &amp; Technicians</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">64 Online</text>
    <text x="16" y="74" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">● 100% Coverage</text>
  </g>

  <g transform="translate(290, 85)">
    <rect width="220" height="85" rx="12" fill="url(#cardGrad2)" stroke="#1E3A5F" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12">Dispatches Today</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">218 Jobs</text>
    <text x="16" y="74" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">Avg Response: 14m</text>
  </g>

  <g transform="translate(540, 85)">
    <rect width="220" height="85" rx="12" fill="url(#cardGrad2)" stroke="#1E3A5F" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="sans-serif" font-size="12">Customer Satisfaction</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">4.96 / 5.0</text>
    <text x="16" y="74" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="bold">⭐⭐⭐⭐⭐ (1.8k reviews)</text>
  </g>

  <!-- Live Dispatch Queue Table -->
  <g transform="translate(40, 195)">
    <rect width="470" height="325" rx="14" fill="#0C182B" stroke="#1E3A5F" stroke-width="1"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">Live Service Bookings &amp; Dispatch</text>
    <text x="20" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11">Real-time WebSocket &amp; PostgreSQL synchronization</text>

    <!-- Table Header -->
    <rect x="15" y="65" width="440" height="28" rx="6" fill="#13233D"/>
    <text x="25" y="83" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="bold">SERVICE TYPE</text>
    <text x="175" y="83" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="bold">LOCATION</text>
    <text x="295" y="83" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="bold">STATUS</text>
    <text x="390" y="83" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="bold">TIME</text>

    <!-- Row 1 -->
    <rect x="15" y="100" width="440" height="48" rx="8" fill="#101D33"/>
    <text x="25" y="128" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">🚗 Roadside Recovery</text>
    <text x="175" y="128" fill="#94A3B8" font-family="sans-serif" font-size="11">Sydney CBD</text>
    <rect x="290" y="115" width="76" height="20" rx="6" fill="#10B981" opacity="0.2"/>
    <text x="298" y="129" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold">● DISPATCHED</text>
    <text x="390" y="128" fill="#94A3B8" font-family="sans-serif" font-size="11">09:15 AM</text>

    <!-- Row 2 -->
    <rect x="15" y="155" width="440" height="48" rx="8" fill="#101D33"/>
    <text x="25" y="183" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">🔋 Battery Replacement</text>
    <text x="175" y="183" fill="#94A3B8" font-family="sans-serif" font-size="11">Melbourne North</text>
    <rect x="290" y="170" width="68" height="20" rx="6" fill="#06B6D4" opacity="0.2"/>
    <text x="298" y="184" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">● IN ROUTE</text>
    <text x="390" y="183" fill="#94A3B8" font-family="sans-serif" font-size="11">09:30 AM</text>

    <!-- Row 3 -->
    <rect x="15" y="210" width="440" height="48" rx="8" fill="#101D33"/>
    <text x="25" y="238" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">🔧 Fleet Maintenance</text>
    <text x="175" y="238" fill="#94A3B8" font-family="sans-serif" font-size="11">Brisbane Port</text>
    <rect x="290" y="225" width="72" height="20" rx="6" fill="#F59E0B" opacity="0.2"/>
    <text x="298" y="239" fill="#FBBF24" font-family="sans-serif" font-size="10" font-weight="bold">● SCHEDULED</text>
    <text x="390" y="238" fill="#94A3B8" font-family="sans-serif" font-size="11">10:00 AM</text>

    <!-- Row 4 -->
    <rect x="15" y="265" width="440" height="48" rx="8" fill="#101D33"/>
    <text x="25" y="293" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">⚡ Electrical Diagnosis</text>
    <text x="175" y="293" fill="#94A3B8" font-family="sans-serif" font-size="11">Perth Central</text>
    <rect x="290" y="280" width="70" height="20" rx="6" fill="#8B5CF6" opacity="0.2"/>
    <text x="298" y="294" fill="#A78BFA" font-family="sans-serif" font-size="10" font-weight="bold">● COMPLETED</text>
    <text x="390" y="293" fill="#94A3B8" font-family="sans-serif" font-size="11">08:45 AM</text>
  </g>

  <!-- Right Dispatch Map Panel -->
  <g transform="translate(530, 195)">
    <rect width="230" height="325" rx="14" fill="#0C182B" stroke="#1E3A5F" stroke-width="1"/>
    <text x="16" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Fleet GPS Map</text>
    <rect x="15" y="45" width="200" height="195" rx="10" fill="#081220" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Radar Grid Lines -->
    <circle cx="115" cy="142" r="70" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="115" cy="142" r="40" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="115" cy="142" r="8" fill="#06B6D4" opacity="0.4"/>
    <circle cx="115" cy="142" r="4" fill="#06B6D4" />

    <!-- Fleet Markers -->
    <circle cx="90" cy="115" r="5" fill="#10B981" />
    <circle cx="145" cy="125" r="5" fill="#38BDF8" />
    <circle cx="130" cy="170" r="5" fill="#F59E0B" />

    <!-- Tech Stack Pill Tags -->
    <text x="16" y="262" fill="#94A3B8" font-family="sans-serif" font-size="11">Architecture:</text>
    <rect x="16" y="277" width="90" height="22" rx="6" fill="#06B6D4" opacity="0.2"/>
    <text x="22" y="292" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">React + Node.js</text>

    <rect x="115" y="277" width="95" height="22" rx="6" fill="#3B82F6" opacity="0.2"/>
    <text x="122" y="292" fill="#60A5FA" font-family="sans-serif" font-size="10" font-weight="bold">PostgreSQL SaaS</text>
  </g>
</svg>
