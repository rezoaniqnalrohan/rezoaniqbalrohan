<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C19" />
      <stop offset="50%" stop-color="#14112E" />
      <stop offset="100%" stop-color="#080712" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#frameBg)" stroke="#2E2856" stroke-width="2"/>

  <!-- Glow Elements -->
  <circle cx="700" cy="110" r="140" fill="#8B5CF6" opacity="0.08" filter="url(#glow4)"/>
  <circle cx="120" cy="460" r="120" fill="#EC4899" opacity="0.08" filter="url(#glow4)"/>

  <!-- Browser Header Bar -->
  <rect x="20" y="20" width="760" height="44" rx="10" fill="#181538" stroke="#2E2856" stroke-width="1"/>
  <circle cx="45" cy="42" r="5" fill="#EF4444" />
  <circle cx="62" cy="42" r="5" fill="#F59E0B" />
  <circle cx="79" cy="42" r="5" fill="#10B981" />
  
  <rect x="110" y="30" width="490" height="24" rx="6" fill="#0B0E1B" stroke="#2E2856" stroke-width="1"/>
  <text x="130" y="46" fill="#A5B4FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">https://hanajapanese.bd &amp; frameit.bd • Bangladesh (BD)</text>
  
  <rect x="680" y="32" width="80" height="20" rx="10" fill="#8B5CF6" opacity="0.2"/>
  <text x="696" y="46" fill="#C084FC" font-family="sans-serif" font-size="10" font-weight="bold">● PORTAL</text>

  <!-- Top Metrics Row -->
  <g transform="translate(40, 85)">
    <rect width="220" height="85" rx="12" fill="#1A163B" stroke="#2E2856" stroke-width="1"/>
    <text x="16" y="26" fill="#A5B4FC" font-family="sans-serif" font-size="12">Active Learners</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">3,600+ Students</text>
    <text x="16" y="74" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">JLPT N5 / N4 Curriculum</text>
  </g>

  <g transform="translate(290, 85)">
    <rect width="220" height="85" rx="12" fill="url(#purpleGrad)" stroke="#6366F1" stroke-width="1"/>
    <text x="16" y="26" fill="#E0E7FF" font-family="sans-serif" font-size="12">Interactive Lessons</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">120+ Video Modules</text>
    <text x="16" y="74" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">Live Kanji Quizzes</text>
  </g>

  <g transform="translate(540, 85)">
    <rect width="220" height="85" rx="12" fill="#1A163B" stroke="#2E2856" stroke-width="1"/>
    <text x="16" y="26" fill="#A5B4FC" font-family="sans-serif" font-size="12">Portfolio Showcase</text>
    <text x="16" y="54" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold">140k+ Impressions</text>
    <text x="16" y="74" fill="#F43F5E" font-family="sans-serif" font-size="10" font-weight="bold">Frameit Visual Gallery</text>
  </g>

  <!-- Main Dual Card Showcase -->
  <g transform="translate(40, 195)">
    <rect width="470" height="325" rx="14" fill="#13102C" stroke="#2E2856" stroke-width="1"/>
    <text x="20" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">HanaJapanese LMS &amp; Frameit Platform</text>
    <text x="20" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11">Supabase Realtime Database &amp; Next/React Architecture</text>

    <!-- Card 1: Japanese LMS -->
    <g transform="translate(20, 68)">
      <rect width="205" height="235" rx="10" fill="#1C183F" stroke="#2E2856" stroke-width="1"/>
      <rect x="12" y="12" width="181" height="115" rx="8" fill="#0E0B25"/>
      <circle cx="102" cy="70" r="30" fill="url(#pinkGrad)" opacity="0.8"/>
      <text x="102" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="22" text-anchor="middle" font-weight="bold">日本語</text>
      <text x="14" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">HanaJapanese LMS</text>
      <text x="14" y="170" fill="#A5B4FC" font-family="sans-serif" font-size="11">Language Learning Portal</text>
      <text x="14" y="205" fill="#EC4899" font-family="sans-serif" font-size="14" font-weight="bold">Live LMS Portal</text>
      <rect x="130" y="188" width="62" height="26" rx="6" fill="#8B5CF6"/>
      <text x="142" y="205" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">View</text>
    </g>

    <!-- Card 2: Frameit Portfolio -->
    <g transform="translate(245, 68)">
      <rect width="205" height="235" rx="10" fill="#1C183F" stroke="#2E2856" stroke-width="1"/>
      <rect x="12" y="12" width="181" height="115" rx="8" fill="#0E0B25"/>
      <circle cx="102" cy="70" r="30" fill="url(#purpleGrad)" opacity="0.8"/>
      <text x="102" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="24" text-anchor="middle">📸</text>
      <text x="14" y="150" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Frameit Media System</text>
      <text x="14" y="170" fill="#A5B4FC" font-family="sans-serif" font-size="11">Creative Portfolio &amp; CMS</text>
      <text x="14" y="205" fill="#A78BFA" font-family="sans-serif" font-size="14" font-weight="bold">4K Showcase</text>
      <rect x="130" y="188" width="62" height="26" rx="6" fill="#8B5CF6"/>
      <text x="142" y="205" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">View</text>
    </g>
  </g>

  <!-- Right Analytics & Tech Stack Panel -->
  <g transform="translate(530, 195)">
    <rect width="230" height="325" rx="14" fill="#13102C" stroke="#2E2856" stroke-width="1"/>
    <text x="16" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Platform Stack</text>

    <g transform="translate(15, 50)">
      <rect width="200" height="60" rx="8" fill="#1C183F"/>
      <text x="12" y="24" fill="#A5B4FC" font-family="sans-serif" font-size="11">Database Performance:</text>
      <text x="12" y="46" fill="#10B981" font-family="sans-serif" font-size="15" font-weight="bold">Supabase Realtime Sync</text>
    </g>

    <g transform="translate(15, 120)">
      <rect width="200" height="60" rx="8" fill="#1C183F"/>
      <text x="12" y="24" fill="#A5B4FC" font-family="sans-serif" font-size="11">Course Completion Rate:</text>
      <text x="12" y="46" fill="#C084FC" font-family="sans-serif" font-size="15" font-weight="bold">88.5% Completion</text>
    </g>

    <!-- Tech Stack Pill Tags -->
    <text x="16" y="225" fill="#A5B4FC" font-family="sans-serif" font-size="11">Architecture:</text>
    <rect x="16" y="240" width="85" height="22" rx="6" fill="#8B5CF6" opacity="0.2"/>
    <text x="24" y="255" fill="#C084FC" font-family="sans-serif" font-size="10" font-weight="bold">React / Next</text>

    <rect x="110" y="240" width="85" height="22" rx="6" fill="#10B981" opacity="0.2"/>
    <text x="118" y="255" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold">Supabase DB</text>

    <rect x="16" y="270" width="95" height="22" rx="6" fill="#F43F5E" opacity="0.2"/>
    <text x="22" y="285" fill="#FB7185" font-family="sans-serif" font-size="10" font-weight="bold">REST APIs &amp; CDN</text>
  </g>
</svg>
